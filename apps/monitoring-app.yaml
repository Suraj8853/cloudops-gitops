apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudops-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Suraj8853/cloudops-gitops
    targetRevision: HEAD
    path: manifests/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops-monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true