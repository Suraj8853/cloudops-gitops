apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudops-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Suraj8853/cloudops-gitops.git
    targetRevision: HEAD
    path: manifests/api
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true