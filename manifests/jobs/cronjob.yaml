apiVersion: batch/v1 
kind: CronJob
metadata:
  name: db-cleanup
  namespace: cloudops-prod
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          containers:
            - name: db-cleanup
              image: postgres:15-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -c "DELETE FROM urls WHERE created_at < NOW() - INTERVAL '90 days';"
              env:
                - name: DB_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: api-config
                      key: DB_HOST
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: api-config
                      key: DB_NAME
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: api-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: api-secret
                      key: DB_PASSWORD
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                allowPrivilegeEscalation: false
          restartPolicy: OnFailure
