apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-sa 
  namespace: cloudops-monitoring


---
apiVersion: rbac.authorization.k8s.io/v1 
kind: ClusterRole 
metadata:
  name: monitoring-role
rules:
  - apiGroups: [""]
    resources: ["pods","nodes","endpoints","services"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets"]
    verbs: ["get","list","watch"]


---

apiVersion: rbac.authorization.k8s.io/v1 
kind: ClusterRoleBinding
metadata:
  name: monitoring-rolebinding
subjects:
  - kind: ServiceAccount
    name: monitoring-sa 
    namespace: cloudops-monitoring
roleRef:
  kind: ClusterRole
  name: monitoring-role
  apiGroup: rbac.authorization.k8s.io
  